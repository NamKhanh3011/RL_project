default_settings: null
behaviors:
  RoombaCleaner:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 6144
      learning_rate: 0.00045
      beta: 0.003
      epsilon: 0.22
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 240000
    time_horizon: 64
    summary_freq: 10000
env_settings:
  seed: 42
