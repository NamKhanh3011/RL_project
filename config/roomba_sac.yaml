default_settings: null
behaviors:
  RoombaCleaner:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: constant
      batch_size: 256
      buffer_size: 50000
      buffer_init_steps: 2000
      tau: 0.005
      steps_per_update: 8.0
      save_replay_buffer: false
      init_entcoef: 0.5
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 120000
    time_horizon: 64
    summary_freq: 10000
env_settings:
  seed: 42
