default_settings: null
behaviors:
  RoombaCleaner:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.05
        learning_rate: 0.0003
        network_settings:
          hidden_units: 128
          num_layers: 2
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 200000
    time_horizon: 128
    summary_freq: 10000
env_settings:
  seed: 101
engine_settings:
  width: 640
  height: 480
  quality_level: 1
  time_scale: 30
  capture_frame_rate: 60
  no_graphics: false
